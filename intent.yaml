INT-PLANS-028:
    version: 1.0.0
    status: active
    statement: "The backend is hexagonal: the domain and use-case modules import no web framework, no database driver and no adapter module."
    rationale: "STD-001. An import-direction check is what makes hexagonal a fact rather than a folder naming convention."
    derived_from: [STD-001]
    test:
        scope: unit
        component: ApplicationCore
        type: invariant
    criticality: high

INT-PLANS-029:
    version: 1.0.0
    status: active
    statement: "The frontend is MVVM: view components hold no data access and no plan-domain logic, reaching the engine only through their view models."
    rationale: "STD-002, checked the same way STD-001 is - by import direction, not by folder names."
    derived_from: [STD-002]
    test:
        scope: unit
        component: PlanCockpit
        type: invariant
    criticality: high

INT-PLANS-030:
    version: 1.0.0
    status: active
    statement: "Every claim in this file names at least one requirement ID from the committed P1 spine, and every ID on that spine is either named by a claim here or carried in the committed descope table beside it."
    rationale: "STD-003 asks for intent tests against the proposal requirement ids; this is the traceability itself made checkable, so a silent drop fails a test instead of surviving a reading. Both halves read from the repo - the spine and its descope table are a docs page (the durable home), NOT the delivery scratch, which is a worktree of another ref and does not exist in the CI checkout this claim runs in."
    derived_from: [STD-003]
    test:
        scope: unit
        component: ApplicationCore
        type: invariant
    criticality: high

INT-PLANS-031:
    version: 1.0.0
    status: active
    statement: "The docs site publishes the REF-Plan dataset contract, the three doors, and the architecture decisions, each as a reachable page."
    rationale: "STD-004; the docs site is priced Full in the frozen P1 component list."
    derived_from: [STD-004]
    test:
        scope: unit
        component: DocsSite
        type: invariant
    criticality: medium

# --- Platform --------------------------------------------------------------

INT-PLANS-032:
    version: 1.0.0
    status: active
    statement: "The app's shipped chart binds the plan store to the platform-granted database and serves the MCP door on its own route, never binding an in-process or file-backed store."
    rationale: "PLT-001's in-repo half, and only that half. The manifest's `mcp: true` entry lives in the install's teams folder in another repository this repo cannot read, so it is checked on the live install rather than as a claim - as is the grant actually being onboarded. What a repo test CAN decide is that the chart asks for the database at all: a chart that never asks would make the live check fail for a reason nobody could see."
    derived_from: [PLT-001]
    test:
        scope: unit
        component: AppManifest
        type: invariant
    criticality: critical

# --- Boundaries (the customer's stated non-goals, made checkable) ----------

INT-PLANS-033:
    version: 1.0.0
    status: active
    statement: "The engine passes an item's authored critical flag through unchanged to every projection and derives no critical path of its own."
    rationale: "BND-001. A derived critical path would silently overwrite the author's judgement."
    derived_from: [BND-001]
    test:
        scope: integration
        component: ApplicationCore
        type: invariant
    criticality: high

INT-PLANS-034:
    version: 1.0.0
    status: active
    statement: "No read path aggregates across plans: the plans list carries only each plan's own summary fields, and no door answers a question spanning two plans' items."
    rationale: "BND-002. The boundary is drawn at aggregation, not at listing - the list's name, updated and next-milestone columns are each one plan's own field."
    derived_from: [BND-002]
    test:
        scope: integration
        component: HttpApi
        type: invariant
    criticality: medium

INT-PLANS-035:
    version: 1.0.0
    status: active
    statement: "The engine authenticates no user of its own: it ships no login route, no session store and no user directory, taking any caller identity it records from the edge proxy's forwarded identity or from the caller's own explicit input."
    rationale: "BND-003: access control is the platform edge alone. Stated about the ENGINE, because the gate itself is the platform's: the oauth2-proxy sidecar on the human surfaces and one scoped credential on the machine door (INT-PLANS-042, INT-PLANS-043). Written as `authenticates nobody` this claim would contradict both of those and be true only of an app nobody can protect."
    derived_from: [BND-003]
    test:
        scope: integration
        component: HttpApi
        type: invariant
    criticality: high

INT-PLANS-036:
    version: 1.0.0
    status: active
    statement: "The engine hosts no workshop: it ships no workshop entity, endpoint or capture format, and a workshop's capture reaches it only by calling the nine MCP tools."
    rationale: "BND-004 and MCP-002: workshops are their own artifact kind, reaching the engine through the nine MCP tools."
    derived_from: [BND-004, MCP-002]
    test:
        scope: integration
        component: McpServer
        type: invariant
    criticality: medium

