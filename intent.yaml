INT-PLANS-012:
    version: 1.0.0
    status: active
    statement: "A person with no agent re-anchors a plan's dates from the UI, and every dependent date in the stored dataset moves with the anchor."
    rationale: "UI-002's fifth act; re-anchoring that leaves dependent dates behind is the silent corruption this claim catches."
    derived_from: [UI-002]
    test:
