# --- The API door ----------------------------------------------------------

INT-PLANS-015:
    version: 1.0.0
    status: active
    statement: "The REST API exposes the same use cases the UI drives, and a write made through REST is visible on the next read through any other door."
    rationale: "API-001 over one write path; a REST adapter with its own logic is the divergence this catches."
    derived_from: [API-001]
    test:
        scope: integration
        component: HttpApi
        type: contract
    criticality: critical

INT-PLANS-016:
    version: 1.0.0
    status: active
    statement: "A GET of a plan returns its dataset as REF-Plan JSON, with no envelope, no renaming and no added fields."
    rationale: "API-002 with PLN-001: the dataset IS the API surface."
    derived_from: [API-002]
    test:
        scope: integration
        component: HttpApi
        type: contract
    criticality: critical

INT-PLANS-017:
    version: 1.0.0
    status: active
    statement: "The export endpoint returns the same bytes the UI displays for that plan version, because both serve the one artifact the export composer produced."
    rationale: "API-003's byte-identity, held by one mechanism: one output compared against itself, never two renderers kept in step."
    derived_from: [API-003]
    test:
        scope: integration
        component: ExportComposer
        type: contract
    criticality: critical

# --- The MCP door ----------------------------------------------------------

INT-PLANS-018:
    version: 1.0.0
    status: active
    statement: "The MCP door exposes exactly the nine named tools - create_plan, get_plan, upsert_item, record_decision, set_status, append_log, reanchor_dates, new_version, export_plan - and each enters the same use case its UI and REST counterpart does."
    rationale: "MCP-001 names the nine; a tenth tool or a tool with its own write path forks the engine."
    derived_from: [MCP-001]
    test:
        scope: integration
        component: McpServer
        type: contract
    criticality: critical

# --- Export ----------------------------------------------------------------

INT-PLANS-019:
    version: 1.0.0
    status: active
    statement: "The exported HTML is a single self-contained file that issues no external network request when opened, with its styles, scripts and type faces embedded."
    rationale: "EXP-001's standalone half, sharpened by embedding the type faces: REF-Plan section 5's font-host default guarantees only a system fallback, and the customer asked for identical."
    derived_from: [EXP-001]
    test:
        scope: integration
        component: ExportComposer
        type: invariant
    criticality: critical

INT-PLANS-020:
    version: 3.0.0
    status: active
    statement: "The exported HTML opened with no network available renders the same plan the UI shows, in the same typography: the identity's font stacks the renderer's sheet carries."
    rationale: "EXP-001's renders-identically-offline half - the proposition embedding the type faces exists to make literally true."
    derived_from: [EXP-001]
    test:
        scope: e2e
        component: ExportComposer
        type: behavior
    criticality: critical

# --- Versioning (rb-library's principles) ---------------------------------

INT-PLANS-021:
    version: 1.0.0
    status: active
    statement: "Every mutating use case - item upsert, status flip, decision, log append and date re-anchor alike - lands as a new version, and every earlier version stays readable at its own content."
    rationale: "VER-001. Re-anchoring is named explicitly because it reads like an in-place correction and is not one."
    derived_from: [VER-001]
    test:
        scope: integration
        component: PlanVersionStore
        type: contract
    criticality: critical

INT-PLANS-022:
    version: 1.0.0
    status: active
    statement: "No use case updates or deletes a stored version: the version store is append-only and its rows are immutable once written."
    rationale: "VER-001's immutability half, which the append-only claim above does not by itself prove."
    derived_from: [VER-001]
    test:
        scope: integration
        component: PlanVersionStore
        type: invariant
    criticality: critical

INT-PLANS-023:
    version: 1.0.0
    status: active
    statement: "Exporting a plan leaves the store byte-identical: no version is written, touched or re-stamped by a read or an export."
    rationale: "VER-002. An export that stamps a rendered-at timestamp into the store is the mutation this catches."
    derived_from: [VER-002]
    test:
        scope: integration
        component: ExportComposer
        type: invariant
    criticality: high

INT-PLANS-024:
    version: 1.0.0
    status: active
    statement: "Every stored version records whether it is ephemeral or kept, and v1 writes only kept versions because saving in the UI writes a version directly."
    rationale: "VER-003: the distinction ships in the store from the start so drafts need no migration later, while no v1 path produces an ephemeral version. Stating both halves is what stops this claim contradicting INT-PLANS-013."
    derived_from: [VER-003]
    test:
        scope: integration
        component: PlanVersionStore
        type: invariant
    criticality: medium

INT-PLANS-025:
    version: 1.0.0
    status: active
    statement: "Every read returns state that was persisted rather than held in process, and every door's writes enter through the same application use cases."
    rationale: "VER-004, and the hexagonal contract that makes the three doors one engine."
    derived_from: [VER-004]
    test:
        scope: integration
        component: ApplicationCore
        type: invariant
    criticality: critical

