    statement: "The ADC plan is present in the running engine as a stored plan and is served through the plan render."
    rationale: "IMP-002 and DONE-003; the seed is the migration path's first proof."
    derived_from: [IMP-002, DONE-003]
    test:
        scope: integration
        component: PlanImporter
        type: behavior
    criticality: high

