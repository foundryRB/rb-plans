# rb-plans - the CSD-INTENT-01 claim set for P1, RB Plans (v1).
#
# Every claim carries `derived_from` against the 35 P1 requirement IDs, and
# every requirement maps to a claim here or to the Descoped table on
# docs/src/content/docs/reference/traceability.md (INT-PLANS-030).
#
# RUNTIME. Three suites carry the markers, all of them belonging to THIS
# project (there is exactly one intent.yaml at the repo root; docs/ is its own
# separate CSD project and its claims are not these):
#   scope: unit | integration | contract-shaped  -> pytest + csd-pytest-intent  (tests/)
#   scope: unit on the frontend                  -> vitest + vitest-intent      (frontend/)
#   scope: e2e                                   -> playwright + playwright-intent (e2e/)
# Each suite runs in this repo's CI (.github/workflows/test.yml), which is the
# run surface every active claim names (REF-CSD.md section 6: "no surface" is a
# finding). The one exception is INT-PLANS-042, the deployed claim, whose
# surface is the in-cluster verification Job; its suite lives in
# tests/deployed/ and CI excludes it.
#
# SCOPE VOCABULARY. csd-intent 0.4.0 admits scope in {unit, integration, e2e},
# test.type in {behavior, contract, invariant}, status in {active, draft,
# deprecated}. It does NOT admit REF-CSD section 3's `llm` scope, so no claim
# here is one: a proposition only a reader can decide is attested by the
# phase's review record instead, never by a marker.

# --- The shell -------------------------------------------------------------

# The walking skeleton's floor claim at 2.0.0: the engine's shell, attested from
# e2e/tests/shell-and-list.spec.ts.
INT-PLANS-001:
    version: 2.0.0
    status: active
    statement: "The engine serves the Plan Cockpit application shell at the root path of the running app."
    rationale: "The one route every other UI claim enters through; the walking skeleton's claim grown into the real shell."
    derived_from: [POS-002, UI-001]
    test:
        scope: e2e
        component: PlanCockpit
        type: behavior
    criticality: high

# --- The contract (REF-Plan.md section 3/4/5) ------------------------------

INT-PLANS-002:
    version: 1.0.0
    status: active
    statement: "A plan read back through any door carries every field of the REF-Plan section 3 dataset it was written with, and no field the engine invented."
    rationale: "PLN-001 makes the section 3 dataset both the storage model and the API surface; an engine-added field would fork the contract."
    derived_from: [PLN-001]
    test:
        scope: integration
        component: ApplicationCore
        type: contract
    criticality: critical

INT-PLANS-003:
    version: 1.0.0
    status: active
    statement: "The plan view the UI shows is produced by the canonical REF-Plan renderer, not by a second implementation living in the cockpit."
    rationale: "PLN-002: the engine's plan view IS the renderer bootstrap-plan ships."
    derived_from: [PLN-002]
    test:
        scope: unit
        component: RendererBundle
        type: invariant
    criticality: critical

INT-PLANS-004:
    version: 1.0.0
    status: active
    statement: "The repository holds exactly one canonical renderer source, and the copies the cockpit and the export composer consume are produced from it mechanically at build time."
    rationale: "PLN-003 forbids two hand-maintained copies; a checked-in projection that drifts from its source is the failure this claim catches."
    derived_from: [PLN-003]
    test:
        scope: unit
        component: RendererBundle
        type: invariant
    criticality: critical

INT-PLANS-005:
    version: 1.0.0
    status: active
    statement: "The docs site carries an ADR recording how the renderer is shared between the bootstrap-plan scaffold and the engine."
    rationale: "PLN-003 asks for the mechanism AND its ADR; the decision without its record is the half that drifts."
    derived_from: [PLN-003]
    test:
        scope: unit
        component: DocsSite
        type: invariant
    criticality: medium

