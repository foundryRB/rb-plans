# --- The done bar, walked end to end ---------------------------------------

INT-PLANS-040:
    version: 1.0.0
    status: active
    statement: "A person with no agent opens the UI, edits an item, records a decision, saves a new version, and downloads a standalone HTML that renders identically offline - in one unbroken sequence."
    rationale: "DONE-001 verbatim. The individual acts each have their own claim; this one attests that they compose, which is what the customer accepts at the delivery gate."
    derived_from: [DONE-001]
    test:
        scope: e2e
        component: PlanCockpit
        type: behavior
    criticality: critical

INT-PLANS-041:
    version: 1.0.0
    status: active
    statement: "An agent completes the same sequence through the MCP door alone - open, edit an item, record a decision, cut a new version, export the standalone HTML - with no UI and no REST call."
    rationale: "DONE-002 and MCP-002's landing surface: the agent door proven equal to the human one, which is the whole point of one write path. Scoped `integration` rather than `e2e` deliberately - an agent sequence has no browser, and the door IS the end for this actor, so an e2e scope would have bought a driver it never needed and a realm login an agent cannot perform."
    derived_from: [DONE-002, MCP-002]
    test:
        scope: integration
        component: McpServer
        type: behavior
    criticality: critical

# --- Access control at the edge -------------------------------------------
#
# Access control IS the platform edge. On this platform an app is reachable at
# `<app>.<foundry-domain>` with no gate at all unless it is granted a realm and
# fronted by the oauth2-proxy sidecar (REF-Foundry.md section 3/section 5), so
# these two claims are what make that true - and REF-Delivery.md
# section 4a requires the positive sign-in claim, one per shipped shell,
# wherever an identity realm is in play. Rejecting the unauthenticated is a
# different proposition and is claim 043's, not claim 042's.

INT-PLANS-042:
    version: 1.0.0
    status: active
    statement: "A person signs in through the app's own identity realm and reaches the Plan Cockpit, attested against the deployed realm rather than a mocked provider."
    rationale: "REF-CSD.md section 6: a fail-closed claim is not a sign-in claim - 'an unauthenticated request is rejected' attests failing closed, a different proposition from a person getting in. Kept headless with a realm-local test user created in-cluster by the one-shot verification Job the run applies, through the realm-scoped admin the grant mints there, which is what leaves the external broker registration an operator gate OFF the evidence path (same section: a credential a person must type is a human gate on the evidence path). This is the ONE deployed claim in this file: it cannot go active before the realm exists, so it is attested on the live install rather than at the local gate, run from tests/deployed/ by that Job, whose status is the verdict - a status the suite itself makes meaningful, since its pytest_sessionfinish hook forces a non-zero exit unless a test actually ran and passed, so a skipped suite cannot report Complete, so the test user's credential never leaves the cluster (REF-CSD.md section 6). Every other e2e claim here is self-contained against the app's own stack."
    derived_from: [BND-003, DONE-001]
    test:
        scope: e2e
        component: PlanCockpit
        type: behavior
    criticality: critical

INT-PLANS-043:
    version: 2.0.0
    status: active
    statement: "The app gates the machine door itself, on that path alone and on no other, fail-closed on its own key: a call carrying no credential, or one that does not match the key, is refused, and the door answers 503 while no key is configured. Every other route but /api/health is served only under PLANS_AUTH_SCOPE=mcp, the shape the chart runs beside the identity realm's oauth2-proxy sidecar, and answers 503 under any other value."
    rationale: "REF-Foundry.md section 3's machine-endpoint rule and its mcp-split conformance check: an agent cannot complete a browser login, so a proxy over /mcp would make DONE-002 unreachable, and no gate at all would leave the write path open to anyone. The app doing the refusing is what makes this attestable in an integration test at all, and it does not contradict INT-PLANS-035: the key is the app's one fail-closed credential (REF-MCP.md section 7, REF-Foundry.md section 4), held by the operator who connects an agent, not a user directory - there is still no login route, no session and no user the engine knows about. The proxy's own OIDC client secret is the human audience's credential and is never the door's (one credential per audience, REF-Foundry.md section 3). Deliberately says nothing about the PROXY skipping /mcp, though that is the other half of the mcp-split shape: no integration test against McpServer can see a sidecar that is not in the app's own stack, and a claim asserting it would go active on a test that never checked it. That half is deployed-only and is attested by credentialed and uncredentialed reads through the edge, not as a claim. Its cause list is deliberately open: the skip route and the proxy's header handling are two of the deployed-only ways it breaks, alongside an unmounted key and REF-MCP.md section 4's two transport rules (a 421 until the server learns its public Host, and a bare /mcp swallowed by the catch-all static mount)."
    derived_from: [MCP-001, BND-003, DONE-002]
    test:
        scope: integration
        component: McpServer
        type: invariant
    criticality: critical

# The startup guard: the app refuses to start on an unset owner role, on the
# one configuration path no CI claim exercises. Unit scope because it is
# decidable against the config loader with no store at all.
INT-PLANS-044:
    version: 1.0.0
    status: active
    statement: "When the engine composes its store connection from discrete settings rather than a supplied connection URL, it refuses to start with an owner role unset, failing with an error that names the missing setting rather than connecting under an implicit default identity."
    rationale: "The platform injects only the database password and declares the owner role install-side, so the role reaches the app as a per-install value that can be empty. Empty must be loud - libpq would otherwise fall back to the container's OS user, which the platform's revoked PUBLIC connect refuses, turning a missing setting into an authentication error nobody can trace back to it. Qualified on the discrete-settings path deliberately: DATABASE_URL takes precedence and CI exports only that, so an unqualified guard would refuse to start in every CI job and redden all 34 store-backed claims at once. Named in the error because the deployed discrete-value path is the one no other claim exercises, so this message is the only thing that will explain it on a live install."
    derived_from: [PLT-001]
    test:
        scope: unit
        component: PlanVersionStore
        type: invariant
    criticality: high

# The connect-an-agent panel (rb-plans#9). The route half is decided against the
# running app over a real store; the frontend suite attests the panel half against
# the same statement.
INT-PLANS-045:
    version: 1.0.0
    status: active
    statement: "The cockpit offers a connect-an-agent panel that fills the MCP connect command with this instance's machine-door key, read from an API route that returns the base64 user:password pair only when both halves are configured, answers 503 while either is unset, and stays behind the gate that fronts the cockpit."
    rationale: "An agent connects to /mcp with the app's own HTTP Basic key (INT-PLANS-043), so the human connecting one needs that key. The panel hands it to whoever already passed the cockpit's gate, so connecting an agent needs no cluster access and no out-of-band read of the Secret; every MCP app on the install surfaces its key the same way. The route widens no exposure: the app serves it, with every other human surface, only behind the oauth2-proxy sidecar (PLANS_AUTH_SCOPE=mcp) and answers 503 otherwise, so the key reaches only a caller who already passed that gate. The proxy half is deployed-only and outside this claim, as it is for INT-PLANS-043."
    derived_from: [MCP-001]
    test:
        scope: integration
        component: HttpApi
        type: invariant
    criticality: high

# The engine's own text in the export. Decided on the exported bytes: a scan
# of the file for the character and its escaped spellings reaches the title
# the composer writes and every string literal of the embedded renderer.
INT-PLANS-046:
    version: 1.0.0
    status: active
    statement: "A plan whose dataset carries no em-dash (U+2014) exports as a standalone HTML file that contains none either, as the character or in an escaped spelling (a JavaScript or CSS escape, an HTML character reference): the title the export composes and the string literals of the embedded renderer use other punctuation."
    rationale: "The em-dash is barred from every delivered artifact (AI-PLAYBOOK.md universal violation #2), and the export is the artifact this engine hands to people outside it. A dataset's text is its author's to keep clean; the engine's share is the text it adds around that dataset, which reaches every export of every plan. The escaped spellings count because the renderer builds its text in the browser, so a \\u2014 in its source reaches the page as the character itself. The cockpit's plan view draws the same renderer (INT-PLANS-003), so the same scan covers the text it adds there."
    derived_from: [EXP-001]
    test:
        scope: integration
        component: ExportComposer
        type: invariant
    criticality: medium
