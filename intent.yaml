        type: behavior
    criticality: high

INT-PLANS-007:
    version: 1.0.0
    status: active
    statement: "A person with no agent creates a new plan from the UI and lands on that plan's render, stored as its first version."
    rationale: "UI-005 - the headline verb the request's own UI bullet omitted; without it a human can only edit the plan the importer seeded."
    derived_from: [UI-005, POS-002]
    test:
        scope: e2e
        component: PlanCockpit
        type: behavior
    criticality: critical

INT-PLANS-008:
