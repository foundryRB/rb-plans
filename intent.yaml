INT-PLANS-014:
    version: 1.0.0
    status: active
    statement: "The version picker lists a plan's versions and presents the decision log entries between two chosen versions as the human-readable diff."
    rationale: "UI-004; the decision log IS the diff the customer asked for, not a field-level delta."
