    derived_from: [UI-002, DONE-004]
    test:
        scope: e2e
        component: PlanCockpit
        type: invariant
    criticality: high

INT-PLANS-039:
    version: 3.0.0
    status: active
    statement: "RB typography is applied in the cockpit: the Segoe UI sans stack for headings and prose, each with its declared system fallback. The exported artifact takes the identity's stacks from the renderer's sheet (INT-PLANS-020)."
    rationale: "The cockpit's own chrome wears the approved RB system stacks; the plan it renders wears whatever identity the vendored sheet was stamped with, so the engine names no typeface for it."
    derived_from: [UI-001, EXP-001]
