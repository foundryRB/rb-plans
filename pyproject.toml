[project]
name = "vf-plans"
version = "0.1.0"
description = "Create and manage REF-Plan project plans: one write path, immutable versions, standalone HTML export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    # mcp 2.x renamed FastMCP to MCPServer with a different import path
    # (backend/adapters/mcp/server.py, and every test that drives it,
    # target the FastMCP-era API) - pinned below 2 deliberately, found by
    # a clean `docker build` resolving to 2.2.0 and crash-looping on
    # `ModuleNotFoundError: mcp.server.fastmcp` where the local dev
    # environment's already-installed 1.28.1 had silently masked it.
    "mcp>=1.2.0,<2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "csd-pytest-intent~=0.3.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "deployed: runs only in-cluster, against the deployed realm (tests/deployed/)",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
