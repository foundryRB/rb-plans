<!doctype html>

<style>
/*__RENDERER_CSS__*/
/* The page around the plan: every consumer that emits a whole plan file fills this one frame,
   so the scaffold and an engine's export are the same page. Its ground and brand come from the
   palette block below, stamped from the identity; the stage block is the identity's own. */
body { margin: 0; padding: 32px; background: var(--bg); }
@media (max-width: 640px) { body { padding: 12px; } }
@media print { body { padding: 0; } }
/* PRESS stage */
/* -- The Software Engineering stage over the shell's ambient element -------------
   Dark: gradient, grids, vignette, three drifting glows, rising motes. Light: paper, the faint
   light grid, solid green motes, a slow neutral light - alive, and never a green wash.
   Source: design-systems/rb-software-engineering/brand/stage_css.py render_field(). 
   Appended after the shell's own rules, which stay as they are. Reduced motion and print stop it. */
.stage > * { display: none !important; }                      /* the shell's own streams, blobs, particles */
.stage {
  position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; opacity: 1;
  background:
    radial-gradient(72% 72% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%) 0 0 / cover no-repeat,
    repeating-linear-gradient(rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 4px) 0 0 / auto,
    linear-gradient(to right, rgba(0, 168, 107,  0.13) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to bottom, rgba(0, 168, 107,  0.13) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to right, rgba(0, 168, 107,  0.07) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(to bottom, rgba(0, 168, 107,  0.07) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(160deg, #0b0d12 0%, #070910 55%, #04050a 100%) !important;
}
.stage::before, .stage::after { content: "" !important; display: block !important; position: fixed; pointer-events: none; z-index: -1;
  filter: none !important; border-radius: 0; mask: none; }
.stage::before {
  inset: -25vh -25vw; width: auto; height: auto;
  background:
    radial-gradient(closest-side, rgba(78, 224, 160,  0.30) 0%, rgba(0, 168, 107,  0.10) 55%, rgba(0, 168, 107,  0) 100%) 4vw -5vh / 81vw 95vh no-repeat,
    radial-gradient(closest-side, rgba(27, 36, 54, 0.85) 0%, rgba(27, 36, 54, 0) 100%) 61vw 50vh / 94vw 105vh no-repeat,
    radial-gradient(closest-side, rgba(0, 168, 107,  0.16) 0%, rgba(0, 168, 107,  0) 100%) 61vw 3vh / 69vw 75vh no-repeat !important;
  will-change: transform;
  animation: rb-drift-a 26s linear infinite !important;
}
.stage::after {
  inset: 0 auto auto 0; width: 2px; height: 2px; border-radius: 50%; background: none !important;
  box-shadow:
    2.8vw 81.0vh 0 0.55px rgba(255, 107, 107, 0.58),
    13.7vw 82.1vh 0 0.11px rgba(255, 107, 107, 0.59),
    24.9vw 90.5vh 0 0.06px rgba(255, 107, 107, 0.53),
    33.3vw 91.2vh 0 0.42px rgba(255, 107, 107, 0.44),
    47.7vw 97.6vh 0 0.39px rgba(255, 107, 107, 0.63),
    54.9vw 58.6vh 0 0.32px rgba(255, 107, 107, 0.45),
    65.7vw 67.9vh 0 0.02px rgba(255, 107, 107, 0.58),
    77.4vw 92.5vh 0 0.31px rgba(255, 107, 107, 0.63),
    88.3vw 85.2vh 0 0.27px rgba(255, 107, 107, 0.52),
    10.1vw 96.9vh 0 0.54px rgba(255, 107, 107, 0.46),
    19.4vw 75.4vh 0 0.32px rgba(255, 107, 107, 0.47),
    28.4vw 76.2vh 0 0.13px rgba(255, 107, 107, 0.58),
    38.3vw 61.5vh 0 0.43px rgba(255, 107, 107, 0.56),
    51.1vw 88.1vh 0 0.22px rgba(255, 107, 107, 0.45),
    62.9vw 82.2vh 0 0.39px rgba(255, 107, 107, 0.63),
    74.3vw 72.9vh 0 0.46px rgba(255, 107, 107, 0.55),
    83.3vw 85.1vh 0 0.19px rgba(255, 107, 107, 0.46),
    93.6vw 87.4vh 0 0.35px rgba(255, 107, 107, 0.57);
  opacity: 0;
  will-change: transform, opacity;
  animation: rb-rise 15s linear -4s infinite !important;
}
:root[data-theme="light"] .stage {
  background:
    linear-gradient(to right, rgba(0, 122, 77,  0.07) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to bottom, rgba(0, 122, 77,  0.07) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to right, rgba(0, 122, 77,  0.035) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(to bottom, rgba(0, 122, 77,  0.035) 1px, transparent 1px) 0 0 / 40px 40px,
    transparent !important;
}
:root[data-theme="light"] .stage::before {
  background:
    radial-gradient(closest-side, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 100%) 8vw 0vh / 70vw 80vh no-repeat,
    radial-gradient(closest-side, rgba(37, 40, 43, 0.055) 0%, rgba(37, 40, 43, 0) 100%) 58vw 46vh / 80vw 90vh no-repeat !important;
  animation-duration: 48s !important;
}
:root[data-theme="light"] .stage::after {
  box-shadow:
    2.8vw 81.0vh 0 0.55px rgba(0, 168, 107,  0.58),

    24.9vw 90.5vh 0 0.06px rgba(0, 168, 107,  0.53),

    47.7vw 97.6vh 0 0.39px rgba(0, 168, 107,  0.63),
    54.9vw 58.6vh 0 0.32px rgba(0, 168, 107,  0.45),
    65.7vw 67.9vh 0 0.02px rgba(0, 168, 107,  0.58),
    77.4vw 92.5vh 0 0.31px rgba(0, 168, 107,  0.63),
    88.3vw 85.2vh 0 0.27px rgba(0, 168, 107,  0.52),
    10.1vw 96.9vh 0 0.54px rgba(0, 168, 107,  0.46),
    19.4vw 75.4vh 0 0.32px rgba(0, 168, 107,  0.47),
    28.4vw 76.2vh 0 0.13px rgba(0, 168, 107,  0.58),
    38.3vw 61.5vh 0 0.43px rgba(0, 168, 107,  0.56),
    51.1vw 88.1vh 0 0.22px rgba(0, 168, 107,  0.45),
    62.9vw 82.2vh 0 0.39px rgba(0, 168, 107,  0.63),
    74.3vw 72.9vh 0 0.46px rgba(0, 168, 107,  0.55),
    83.3vw 85.1vh 0 0.19px rgba(0, 168, 107,  0.46),
    93.6vw 87.4vh 0 0.35px rgba(0, 168, 107,  0.57);
}
@keyframes rb-drift-a { 0%, 100% { transform: translate(0, 0); } 33.33% { transform: translate(8.6vw, 8.7vh); } 66.67% { transform: translate(-3.9vw, 5.1vh); } }
@keyframes rb-rise {
  0%   { transform: translateY(0); opacity: 0; }
  25%  { opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translateY(-130px); opacity: 0; }
}
@media print { .stage { display: none !important; } }
@media (prefers-reduced-motion: reduce) { .stage::before, .stage::after { animation: none !important; } .stage::after { opacity: .8; } }
@media (prefers-color-scheme: light) {
:root:not([data-theme="dark"]) .stage {
  background:
    linear-gradient(to right, rgba(0, 122, 77,  0.07) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to bottom, rgba(0, 122, 77,  0.07) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(to right, rgba(0, 122, 77,  0.035) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(to bottom, rgba(0, 122, 77,  0.035) 1px, transparent 1px) 0 0 / 40px 40px,
    transparent !important;
}
:root:not([data-theme="dark"]) .stage::before {
  background:
    radial-gradient(closest-side, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 100%) 8vw 0vh / 70vw 80vh no-repeat,
    radial-gradient(closest-side, rgba(37, 40, 43, 0.055) 0%, rgba(37, 40, 43, 0) 100%) 58vw 46vh / 80vw 90vh no-repeat !important;
  animation-duration: 48s !important;
}
:root:not([data-theme="dark"]) .stage::after {
  box-shadow:
    2.8vw 81.0vh 0 0.55px rgba(0, 168, 107,  0.58),

    54.9vw 58.6vh 0 0.32px rgba(0, 168, 107,  0.45),
    65.7vw 67.9vh 0 0.02px rgba(0, 168, 107,  0.58),
    77.4vw 92.5vh 0 0.31px rgba(0, 168, 107,  0.63),
    88.3vw 85.2vh 0 0.27px rgba(0, 168, 107,  0.52),
    10.1vw 96.9vh 0 0.54px rgba(0, 168, 107,  0.46),
    19.4vw 75.4vh 0 0.32px rgba(0, 168, 107,  0.47),
    28.4vw 76.2vh 0 0.13px rgba(0, 168, 107,  0.58),
    38.3vw 61.5vh 0 0.43px rgba(0, 168, 107,  0.56),
    51.1vw 88.1vh 0 0.22px rgba(0, 168, 107,  0.45),
    62.9vw 82.2vh 0 0.39px rgba(0, 168, 107,  0.63),
    74.3vw 72.9vh 0 0.46px rgba(0, 168, 107,  0.55),
    83.3vw 85.1vh 0 0.19px rgba(0, 168, 107,  0.46),
    93.6vw 87.4vh 0 0.35px rgba(0, 168, 107,  0.57);
}
}
html[data-hidden="true"] .stage::before, html[data-hidden="true"] .stage::after { animation-play-state: paused !important; }
/* /PRESS stage */
/* PRESS palette */
:root,:root[data-theme="light"]{color-scheme:light;--bg:#f2f2f2;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#04050a;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#04050a;}
@media print{:root,:root[data-theme="light"],:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light;--bg:#f2f2f2;}}
/* /PRESS palette */
</style>

<body>
<!-- PRESS stage -->
<div class="stage" aria-hidden="true"></div>
<!-- /PRESS stage -->
<noscript>This is a data-driven plan (REF-Plan): enable JavaScript to render it from the embedded dataset.</noscript>
<div id="plan-root"></div>
<script type="application/json" id="plan-data">
__DATASET__
</script>
<script>
/*__RENDERER_JS__*/
</script>
<script>
(function () {
    var root = document.documentElement;
    function visibility() { root.dataset.hidden = String(document.hidden); }
    visibility();
    document.addEventListener("visibilitychange", visibility);
    var data = JSON.parse(document.getElementById("plan-data").textContent);
    PlanRenderer.render(data, document.getElementById("plan-root"));
})();
</script>
</body>
